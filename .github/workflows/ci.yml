name: Check and deploy

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: pnpm format:check && pnpm check:web && pnpm build:web
      - run: cargo install worker-build --version 0.9.0 --locked
      - run: pnpm build:worker
      - name: Verify quote workflow in local Worker and D1
        run: |
          node scripts/configure.mjs --local
          pnpm exec wrangler d1 migrations apply DB --local --cwd worker --config wrangler.generated.json
          pnpm exec wrangler dev --local --cwd worker --config wrangler.generated.json --port 8787 > /tmp/smarfit-worker.log 2>&1 &
          for attempt in {1..90}; do
            if curl --silent --fail http://127.0.0.1:8787/api/health; then
              node scripts/smoke.mjs http://127.0.0.1:8787
              exit $?
            fi
            sleep 2
          done
          cat /tmp/smarfit-worker.log
          exit 1

  deploy:
    needs: check
    if: github.event_name == 'push' && vars.SMARFIT_URL != ''
    runs-on: ubuntu-latest
    concurrency:
      group: smarfit-deploy-${{ github.ref }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SMARFIT_D1_MAIN: ${{ vars.SMARFIT_D1_MAIN }}
      SMARFIT_D1_PREVIEW: ${{ vars.SMARFIT_D1_PREVIEW }}
      SMARFIT_URL: ${{ vars.SMARFIT_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile && pnpm build:web
      - run: cargo install worker-build --version 0.9.0 --locked
      - name: Deploy branch preview
        if: github.ref != 'refs/heads/main'
        run: |
          node scripts/configure.mjs --preview
          pnpm exec wrangler d1 migrations apply DB --remote --cwd worker --config wrangler.generated.json
          preview="branch-$(printf '%s' "$GITHUB_REF_NAME" | sha256sum | cut -c1-12)"
          pnpm exec wrangler preview --name "$preview" --cwd worker --config wrangler.generated.json | tee /tmp/smarfit-preview.log
          {
            echo '### Cloudflare Preview'
            cat /tmp/smarfit-preview.log
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy main
        if: github.ref == 'refs/heads/main'
        run: |
          node scripts/configure.mjs
          pnpm exec wrangler d1 migrations apply DB --remote --cwd worker --config wrangler.generated.json
          pnpm exec wrangler deploy --cwd worker --config wrangler.generated.json
          if ! node scripts/verify-deploy.mjs "$SMARFIT_URL"; then
            pnpm exec wrangler rollback --yes --message "SmarFit health check failed" --cwd worker --config wrangler.generated.json
            exit 1
          fi
